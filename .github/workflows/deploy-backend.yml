name: Build and Deploy Backend

on:
  push:
    branches:
      - release
    paths:
      - 'backendStrapi/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: # Позволяет запускать вручную через GitHub UI

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend-strapi

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: release
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=release-
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backendStrapi
          file: ./backendStrapi/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  deploy:
    name: Deploy Backend to Server
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: release
      
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      
      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts || true
          chmod 600 ~/.ssh/known_hosts || true
      
      - name: Deploy to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=10 -o ConnectTimeout=30 -o TCPKeepAlive=yes ${SERVER_USER}@${SERVER_HOST} << 'EOF'
            set -e
            echo "🚀 Starting backend deployment..."
            
            cd ~/sportmagazine
            
            # Сохраняем .env файлы перед обновлением
            echo "💾 Backing up .env files..."
            if [ -f backendStrapi/.env ]; then
              cp backendStrapi/.env backendStrapi/.env.backup || true
              echo "✅ .env file backed up"
            fi
            
            # Обновляем код из репозитория
            echo "📥 Pulling latest changes from release branch..."
            # Исправляем проблемы с Git refs если есть
            git remote prune origin || true
            rm -f .git/refs/remotes/origin/release || true
            git fetch origin --prune || true
            git checkout release || git checkout -b release origin/release || true
            git pull origin release || git reset --hard origin/release || true
            
            # Восстанавливаем .env файлы если они были удалены
            echo "🔄 Restoring .env files..."
            if [ -f backendStrapi/.env.backup ] && [ ! -f backendStrapi/.env ]; then
              mv backendStrapi/.env.backup backendStrapi/.env
              echo "✅ .env file restored"
            elif [ -f backendStrapi/.env.backup ]; then
              rm backendStrapi/.env.backup
              echo "✅ .env file already exists, backup removed"
            fi
            
            # Переходим в папку backendStrapi
            cd backendStrapi
            
            # Логин в GHCR (если нужен для pull)
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin || true
            
            # Pull готового образа
            echo "📥 Pulling latest image from GHCR..."
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest || true
            
            # Останавливаем текущие контейнеры
            echo "🛑 Stopping current containers..."
            docker compose down || true
            
            # Запускаем контейнеры (образ уже скачан)
            echo "▶️ Starting containers..."
            docker compose up -d
            
            # Ждем запуска
            echo "⏳ Waiting for containers to start..."
            sleep 15
            
            # Проверяем логи Strapi
            echo "📋 Strapi container logs:"
            docker logs sportmagazine_strapi --tail 50 || true
            
            # Проверяем логи PostgreSQL
            echo "📋 PostgreSQL container logs:"
            docker logs sportmagazine_postgres --tail 20 || true
            
            # Проверяем здоровье API
            echo "🏥 Health check..."
            if curl -f http://localhost:1337/api > /dev/null 2>&1; then
              echo "✅ Backend API is healthy!"
            else
              echo "⚠️ Backend health check failed, but deployment completed"
              echo "Check logs for more information"
            fi
            
            echo "✅ Backend deployment completed!"
          EOF
      
      - name: Deployment status
        run: |
          echo "✅ Backend deployment workflow completed"
