name: Deploy Frontend

on:
  push:
    branches:
      - release
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch: # Позволяет запускать вручную через GitHub UI

jobs:
  deploy:
    name: Deploy Frontend to Server
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: release
      
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      
      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts || true
          chmod 600 ~/.ssh/known_hosts || true
      
      - name: Deploy to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=10 -o ConnectTimeout=30 -o TCPKeepAlive=yes ${SERVER_USER}@${SERVER_HOST} << 'EOF'
            set -e
            echo "🚀 Starting frontend deployment..."
            
            cd ~/sportmagazine
            
            # Сохраняем .env файлы перед обновлением
            echo "💾 Backing up .env files..."
            if [ -f frontend/.env ]; then
              cp frontend/.env frontend/.env.backup || true
              echo "✅ .env file backed up"
            fi
            if [ -f frontend/.env.local ]; then
              cp frontend/.env.local frontend/.env.local.backup || true
              echo "✅ .env.local file backed up"
            fi
            
            # Очистка диска перед обновлением кода
            echo "🧹 Cleaning up disk space before deployment..."
            df -h
            docker system prune -f --volumes || true
            docker builder prune -af || true
            npm cache clean --force 2>/dev/null || true
            yarn cache clean 2>/dev/null || true
            df -h
            
            # Обновляем код из репозитория
            echo "📥 Pulling latest changes from release branch..."
            # Исправляем проблемы с Git refs если есть
            git remote prune origin || true
            rm -f .git/refs/remotes/origin/release || true
            git fetch origin --prune || true
            git checkout release || git checkout -b release origin/release || true
            git pull origin release || git reset --hard origin/release || true
            
            # Восстанавливаем .env файлы если они были удалены
            echo "🔄 Restoring .env files..."
            if [ -f frontend/.env.backup ] && [ ! -f frontend/.env ]; then
              mv frontend/.env.backup frontend/.env
              echo "✅ .env file restored"
            elif [ -f frontend/.env.backup ]; then
              rm frontend/.env.backup
              echo "✅ .env file already exists, backup removed"
            fi
            if [ -f frontend/.env.local.backup ] && [ ! -f frontend/.env.local ]; then
              mv frontend/.env.local.backup frontend/.env.local
              echo "✅ .env.local file restored"
            elif [ -f frontend/.env.local.backup ]; then
              rm frontend/.env.local.backup
              echo "✅ .env.local file already exists, backup removed"
            fi
            
            # Переходим в папку frontend
            cd frontend
            
            # Останавливаем текущий контейнер
            echo "🛑 Stopping current container..."
            docker compose down || true
            
            # Пересобираем образ (используем кеш для ускорения)
            echo "🔨 Building new Docker image..."
            docker compose build
            
            # Запускаем контейнер
            echo "▶️ Starting container..."
            docker compose up -d
            
            # Ждем запуска
            echo "⏳ Waiting for container to start..."
            sleep 10
            
            # Проверяем логи
            echo "📋 Container logs:"
            docker logs sportmagazine-frontend --tail 50 || true
            
            # Проверяем здоровье приложения
            echo "🏥 Health check..."
            if curl -f http://localhost:3000 > /dev/null 2>&1; then
              echo "✅ Frontend is healthy!"
            else
              echo "⚠️ Frontend health check failed, but deployment completed"
            fi
            
            echo "✅ Frontend deployment completed!"
          EOF
      
      - name: Deployment status
        run: |
          echo "✅ Frontend deployment workflow completed"


