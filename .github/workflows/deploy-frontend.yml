name: Build and Deploy Frontend

on:
  push:
    branches:
      - release
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch: # Позволяет запускать вручную через GitHub UI

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mayraiden/borkssport/frontend

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: release
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=release-
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          build-args: |
            NEXT_PUBLIC_STRAPI_URL=${{ secrets.NEXT_PUBLIC_STRAPI_URL || 'https://api.borkssport.ru' }}
            BUILDKIT_INLINE_CACHE=1

  deploy:
    name: Deploy Frontend to Server
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: release
      
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      
      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts || true
          chmod 600 ~/.ssh/known_hosts || true
      
      - name: Deploy to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o ServerAliveInterval=60 -o ServerAliveCountMax=10 -o ConnectTimeout=30 -o TCPKeepAlive=yes ${SERVER_USER}@${SERVER_HOST} << 'EOF'
            set -e
            REGISTRY='${{ env.REGISTRY }}'
            IMAGE_NAME='${{ env.IMAGE_NAME }}'
            GHCR_USERNAME='${{ secrets.GHCR_USERNAME }}'
            GHCR_READ_TOKEN='${{ secrets.GHCR_READ_TOKEN }}'
            echo "🚀 Starting frontend deployment..."
            
            cd ~/sportmagazine
            
            # Сохраняем .env файлы перед обновлением
            echo "💾 Backing up .env files..."
            if [ -f frontend/.env ]; then
              cp frontend/.env frontend/.env.backup || true
              echo "✅ .env file backed up"
            fi
            if [ -f frontend/.env.local ]; then
              cp frontend/.env.local frontend/.env.local.backup || true
              echo "✅ .env.local file backed up"
            fi
            
            # Обновляем код из репозитория
            echo "📥 Pulling latest changes from release branch..."
            # Исправляем проблемы с Git refs если есть
            git remote prune origin || true
            rm -f .git/refs/remotes/origin/release || true
            git fetch origin --prune || true
            git checkout release || git checkout -b release origin/release || true
            git pull origin release || git reset --hard origin/release || true
            
            # Восстанавливаем .env файлы если они были удалены
            echo "🔄 Restoring .env files..."
            if [ -f frontend/.env.backup ] && [ ! -f frontend/.env ]; then
              mv frontend/.env.backup frontend/.env
              echo "✅ .env file restored"
            elif [ -f frontend/.env.backup ]; then
              rm frontend/.env.backup
              echo "✅ .env file already exists, backup removed"
            fi
            if [ -f frontend/.env.local.backup ] && [ ! -f frontend/.env.local ]; then
              mv frontend/.env.local.backup frontend/.env.local
              echo "✅ .env.local file restored"
            elif [ -f frontend/.env.local.backup ]; then
              rm frontend/.env.local.backup
              echo "✅ .env.local file already exists, backup removed"
            fi
            
            # Переходим в папку frontend
            cd frontend

            # Вычисляем тег по фактическому commit hash на сервере
            IMAGE_TAG="release-$(git rev-parse --short=7 HEAD)"
            export FRONTEND_IMAGE="${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
            echo "Using frontend image: ${FRONTEND_IMAGE}"

            # Авторизация в GHCR для приватных пакетов
            if [ -z "${GHCR_USERNAME}" ] || [ -z "${GHCR_READ_TOKEN}" ]; then
              echo "❌ Missing GHCR_USERNAME/GHCR_READ_TOKEN secrets"
              exit 1
            fi
            echo "${GHCR_READ_TOKEN}" | docker login "${REGISTRY}" -u "${GHCR_USERNAME}" --password-stdin
            
            # Pull pinned-образа по digest
            echo "📥 Pulling pinned frontend image..."
            docker pull "${FRONTEND_IMAGE}"
            
            # Останавливаем текущий контейнер
            echo "🛑 Stopping current container..."
            docker compose down || true
            
            # Запускаем контейнер (образ уже скачан)
            echo "▶️ Starting container..."
            docker compose up -d
            
            # Ждем запуска
            echo "⏳ Waiting for container to start..."
            sleep 10
            
            # Проверяем логи
            echo "📋 Container logs:"
            docker logs sportmagazine-frontend --tail 50 || true
            
            # Проверяем здоровье приложения
            echo "🏥 Health check..."
            if curl -f http://localhost:3000 > /dev/null 2>&1; then
              echo "✅ Frontend is healthy!"
            else
              echo "⚠️ Frontend health check failed, but deployment completed"
              echo "Check logs for more information"
            fi

            # Проверка IoC после старта контейнера
            echo "🔍 Running post-deploy IoC check..."
            bash ../scripts/security/check-container-iocs.sh sportmagazine-frontend
            
            echo "✅ Frontend deployment completed!"
          EOF
      
      - name: Deployment status
        run: |
          echo "✅ Frontend deployment workflow completed"
