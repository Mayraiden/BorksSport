services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sportmagazine-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    ports:
      - '3000:3000'
    networks:
      - frontend-network

networks:
  frontend-network:
    driver: bridge
    external: false

