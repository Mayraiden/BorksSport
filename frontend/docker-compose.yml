services:
  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    container_name: sportmagazine-frontend
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: '0.0.0.0'
      NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL:-https://api.borkssport.ru}
      NEXT_PUBLIC_EMAIL_AUTH_DISABLED: ${NEXT_PUBLIC_EMAIL_AUTH_DISABLED:-}
    ports:
      - '127.0.0.1:3000:3000'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /run:rw,nosuid,nodev,size=8m
      - /app/.next/cache:rw,noexec,nosuid,nodev,size=128m
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    networks:
      - frontend-network

networks:
  frontend-network:
    driver: bridge
    external: false
